<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Specter Sim"><meta name="theme-color" content="#14101f">
<title>Specter Wallet Simulator</title>
<style>
:root{color-scheme:dark;--bg:#14101f;--s:#201a33;--s2:#2b2344;--t:#f3f0ff;--m:#a79fc4;--a:#8b7bff;--r:#ff6b81;box-sizing:border-box}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 ui-rounded,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--s2);color:var(--m);text-align:center;font-size:13px;padding:6px}
main{max-width:480px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:34px;margin:24px 0 4px}h2{margin:8px 0 12px}h3{margin:22px 0 8px;font-size:16px}
.m{color:var(--m)}.e{color:var(--r);min-height:1.4em}small{font-size:12px}
.big{font-size:40px;font-weight:700;margin-bottom:16px}
label{display:block;color:var(--m);margin:10px 0;font-size:14px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid var(--s2);background:var(--s);color:var(--t);font:inherit}
button{font:inherit;color:var(--t);background:var(--s2);border:0;border-radius:10px;padding:12px 14px;margin:6px 6px 6px 0;cursor:pointer}
button.p{background:var(--a);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;background:var(--s);border-radius:12px;padding:12px;margin-bottom:8px}
.row b{width:52px}.row .m{flex:1;font-size:13px}.r2{text-align:right}
.w{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.w span{background:var(--s);padding:10px;border-radius:10px}
.qr{background:#fff;padding:12px;border-radius:12px;width:fit-content;margin:12px auto}
code{display:block;word-break:break-all;background:var(--s);padding:10px;border-radius:10px;margin-bottom:8px}
pre{background:var(--s);padding:10px;border-radius:10px;overflow-x:auto;font-size:12px;white-space:pre-wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;margin:0 3px;background:none;color:var(--m)}nav button.on{background:var(--s2);color:var(--t)}
</style></head><body>
<header>Simulator only: fake coins, no real blockchain</header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const COINS=[['SOL',148.2],['ETH',2450],['BTC',64000],['USDC',1],['BONK',0.00002],['JUP',0.9],['RAY',2.1]];
const START=[['SOL',10],['ETH',1.5],['BTC',0.05],['USDC',500],['BONK',1000000],['JUP',250],['RAY',100]];
const SY='ka ze mi ro tu vi lo sa'.split(' '),WORDS=SY.flatMap(a=>SY.map(b=>a+b));
const AL={name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},enc=new TextEncoder(),dec=new TextDecoder();
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const $=s=>document.querySelector(s),app=$('#app'),ST='spx_state',BX='spx_box';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const fmt=(n,d=4)=>(+n).toLocaleString(undefined,{maximumFractionDigits:d}),usd=n=>'$'+(+n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const price=c=>COINS.find(x=>x[0]==c)[1],payload=t=>[t.id,t.c,t.a,t.to,t.ts].join('|');
const tid=()=>[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
let S,priv,pub,tab='wallet',sortBy='ts',asc=false;
const save=()=>ls.set(ST,JSON.stringify(S));
const log=m=>{S.audit.push(new Date().toLocaleTimeString()+'  '+m);save()};

/* AES-256-GCM encryption of the recovery phrase and signing key */
async function key(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));return{salt:b64(salt),iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(JSON.stringify(o))))}}
async function open(b,pw){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(b.iv)},await key(pw,ub(b.salt)),ub(b.ct))))}
async function addr(seed){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(seed)));return'sp'+[...h].map(x=>x.toString(36).padStart(2,'0')).join('').slice(0,32)}
async function loadKeys(pj){priv=await crypto.subtle.importKey('jwk',pj,AL,false,['sign']);pub=await crypto.subtle.importKey('jwk',{kty:pj.kty,n:pj.n,e:pj.e,alg:pj.alg,ext:true},AL,false,['verify'])}

/* Data structures */
class LinkedList{constructor(){this.h=this.t=null}add(v){const x={v,next:null};this.t?this.t.next=x:this.h=x;this.t=x}toArray(){const a=[];for(let c=this.h;c;c=c.next)a.push(c.v);return a}}
function bubble(a,k,asc){const v=x=>k=='ts'?x.ts:x.a*price(x.c);for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++)if(asc?v(a[j])>v(a[j+1]):v(a[j])<v(a[j+1]))[a[j],a[j+1]]=[a[j+1],a[j]]}

/* Setup screens */
function welcome(){if(ls.get(BX))return unlock();
 app.innerHTML=`<h1>Specter Sim</h1><p class=m>A practice wallet for learning how wallets work. Nothing here touches a real blockchain.</p><button id=c class=p>Create wallet</button><button id=i>Import wallet</button>`;
 $('#c').onclick=create;$('#i').onclick=imp}
function create(){app.innerHTML=`<h2>Create wallet</h2><label>Password<input id=pw type=password autocomplete=new-password></label><p class=e id=er></p><button id=go class=p>Generate recovery phrase</button><button id=bk>Back</button>`;
 $('#bk').onclick=welcome;$('#go').onclick=()=>{const pw=$('#pw').value;if(pw.length<6)return $('#er').textContent='Use at least 6 characters.';
 const seed=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>WORDS[x%64]).join(' ');
 app.innerHTML=`<h2>Your recovery phrase</h2><p class=m>These words only work in this simulator. Write them down to practice importing.</p><div class=w>${seed.split(' ').map((w,i)=>`<span>${i+1}. ${w}</span>`).join('')}</div><button id=ok class=p>Open wallet</button>`;
 $('#ok').onclick=()=>boot(seed,pw)}}
function imp(){app.innerHTML=`<h2>Import wallet</h2><label>12-word phrase<textarea id=sd rows=3 autocapitalize=off></textarea></label><label>New password<input id=pw type=password autocomplete=new-password></label><p class=e id=er></p><button id=go class=p>Import wallet</button><button id=bk>Back</button>`;
 $('#bk').onclick=welcome;$('#go').onclick=()=>{const s=$('#sd').value.trim().toLowerCase().split(/\s+/),pw=$('#pw').value;
 if(s.length!=12||s.some(w=>!WORDS.includes(w)))return $('#er').textContent='Only 12-word phrases made by this simulator work. Never enter a real recovery phrase.';
 if(pw.length<6)return $('#er').textContent='Use at least 6 characters.';boot(s.join(' '),pw)}}
function unlock(){app.innerHTML=`<h2>Welcome back</h2><label>Password<input id=pw type=password autocomplete=current-password></label><p class=e id=er></p><button id=go class=p>Unlock</button><button id=rs>Erase wallet</button>`;
 $('#go').onclick=async()=>{try{const d=await open(JSON.parse(ls.get(BX)),$('#pw').value);await loadKeys(d.pj);S=JSON.parse(ls.get(ST));home()}catch{$('#er').textContent='Wrong password.'}};
 $('#rs').onclick=()=>{if(confirm('Erase this wallet and start over?')){ls.del(BX);ls.del(ST);welcome()}}}
async function boot(seed,pw){const kp=await crypto.subtle.generateKey({...AL,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,['sign','verify']);
 const pj=await crypto.subtle.exportKey('jwk',kp.privateKey);await loadKeys(pj);ls.set(BX,JSON.stringify(await seal({seed,pj},pw)));
 S={addr:await addr(seed),bal:Object.fromEntries(START),hist:[],pool:[],undo:[],audit:[]};log('Wallet created');home()}

/* Main app */
function home(){const T=['wallet','send','receive','activity'];
 app.innerHTML=`<div id=v></div><nav>${T.map(t=>`<button data-t=${t} class="${t==tab?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home()});
 ({wallet:vWallet,send:vSend,receive:vReceive,activity:vActivity})[tab]()}
function vWallet(){const tot=COINS.reduce((s,[c,p])=>s+S.bal[c]*p,0);
 $('#v').innerHTML=`<p class=m>Total balance (fake)</p><div class=big>${usd(tot)}</div>${COINS.map(([c,p])=>`<div class=row><b>${c}</b><span class=m>$${fmt(p,6)}</span><span class=r2>${fmt(S.bal[c])}<br><small class=m>${usd(S.bal[c]*p)}</small></span></div>`).join('')}`}
function vSend(){$('#v').innerHTML=`<h2>Send</h2><label>Coin<select id=co>${COINS.map(c=>`<option>${c[0]}</option>`).join('')}</select></label><label>To address<input id=to placeholder="sp…" autocapitalize=off autocorrect=off></label><label>Amount<input id=am inputmode=decimal></label><p class=m>Network fee: 0.5% of the amount. Sent transactions wait in the mempool until you process them.</p><p class=e id=er></p><button class=p id=go>Add to mempool</button>`;$('#go').onclick=send}
async function send(){const c=$('#co').value,to=$('#to').value.trim().toLowerCase(),a=parseFloat($('#am').value),er=m=>$('#er').textContent=m;
 if(!/^sp[0-9a-z]{32}$/.test(to))return er('Address must start with sp and be 34 characters long.');
 if(to==S.addr)return er('You cannot send to your own address.');
 if(!(a>0))return er('Enter an amount above zero.');
 const fee=a*0.005;if(a+fee>S.bal[c])return er(`Not enough ${c}. You need ${fmt(a+fee)} including the fee.`);
 const t={id:tid(),c,a,fee,to,from:S.addr,ts:Date.now(),st:'pending'};
 t.sig=b64(await crypto.subtle.sign(AL,priv,enc.encode(payload(t))));
 S.bal[c]-=a+fee;S.pool.push(t);S.pool.sort((x,y)=>y.a*price(y.c)-x.a*price(x.c));S.undo.push(t.id);
 log(`Queued ${t.id.slice(0,8)}: ${fmt(a)} ${c}`);tab='activity';home()}
function vReceive(){$('#v').innerHTML=`<h2>Receive</h2><div id=qr class=qr></div><code>${S.addr}</code><button id=cp class=p>Copy address</button>`;
 try{const q=qrcode(0,'M');q.addData(S.addr);q.make();$('#qr').innerHTML=q.createSvgTag(5,0)}catch{$('#qr').textContent='QR code needs an internet connection to load.'}
 $('#cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(S.addr)}
async function proc(all){do{const t=S.pool.shift();if(!t)break;
 const ok=await crypto.subtle.verify(AL,pub,ub(t.sig),enc.encode(payload(t)));
 if(ok){t.st='confirmed';log('Confirmed '+t.id.slice(0,8))}else{S.bal[t.c]+=t.a+t.fee;t.st='rejected';log('Rejected '+t.id.slice(0,8)+': bad signature')}
 S.hist.push(t)}while(all&&S.pool.length);save();home()}
function undo(){const id=S.undo.pop();if(!id)return;let t=S.pool.find(x=>x.id==id);
 if(t)S.pool=S.pool.filter(x=>x!=t);else t=S.hist.find(x=>x.id==id);
 if(!t||t.st!='confirmed'&&t.st!='pending')return undo();
 S.bal[t.c]+=t.a+t.fee;t.st='undone';if(!S.hist.includes(t))S.hist.push(t);log('Undid '+t.id.slice(0,8));home()}
const rowT=t=>`<div class=row><b>${t.c}</b><span class=m>${t.st} (${t.id.slice(0,8)})</span><span class=r2>-${fmt(t.a)}</span></div>`;
function vActivity(){const h=S.hist.slice();bubble(h,sortBy,asc);const L=new LinkedList();S.audit.forEach(x=>L.add(x));
 $('#v').innerHTML=`<h2>Activity</h2><button id=pn class=p>Process next</button><button id=pa>Process all</button><button id=un>Undo last send</button>
 <h3>Mempool (${S.pool.length}), highest value first</h3>${S.pool.map(rowT).join('')||'<p class=m>Empty. Send something to queue it.</p>'}
 <h3>History</h3><button id=sb>Sort by: ${sortBy=='ts'?'date':'amount'}</button><button id=sd>${asc?'Ascending':'Descending'}</button>${h.map(rowT).join('')||'<p class=m>Nothing processed yet.</p>'}
 <h3>Audit log</h3><pre>${L.toArray().slice(-12).reverse().join('\n')}</pre>`;
 $('#pn').onclick=()=>proc(false);$('#pa').onclick=()=>proc(true);$('#un').onclick=undo;
 $('#sb').onclick=()=>{sortBy=sortBy=='ts'?'amt':'ts';home()};$('#sd').onclick=()=>{asc=!asc;home()}}
welcome();
</script></body></html>
